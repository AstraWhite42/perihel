name: Publish macOS and Windows release

on:
  push:
    tags:
      - 'v*-build*'

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Match tag to version.json
        run: |
          expected=$(jq -er '"v\(.version)-build\(.build)"' version.json)
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Expected tag $expected for this version.json" >&2
            exit 1
          fi

  macos:
    needs: check-tag
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Package Apple Silicon app
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/*-AppleSilicon.zip
            dist/*-AppleSilicon.zip.sha256
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  windows:
    needs: check-tag
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Package self-contained Windows x64 app
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*-Windows-x64.zip
            dist/*-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: packages
          merge-multiple: true

      - name: Verify both packages and publish one release
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=()
          for platform in AppleSilicon Windows-x64; do
            file="perihel-${GITHUB_REF_NAME#v}-$platform.zip"
            sha256sum --check "$file.sha256"
            assets+=("$file" "$file.sha256")
          done
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "近星点 $GITHUB_REF_NAME"
